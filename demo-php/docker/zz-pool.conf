; Static worker pool sized for the 4-core container. The php:fpm default
; (pm=dynamic, max_children=5) collapses well before c=100.
[www]
listen = 127.0.0.1:9000
listen.backlog = 8192
pm = static
pm.max_children = 32
pm.max_requests = 0
access.log = /dev/null
clear_env = no
catch_workers_output = yes
