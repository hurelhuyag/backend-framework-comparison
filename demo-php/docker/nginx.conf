# Minimal Nginx in front of PHP-FPM, tuned for benchmarking (no access log, no keepalive to FPM).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # No `keepalive` to php-fpm on purpose: FPM ties a worker to each kept-alive connection,
    # so an nginx keepalive pool larger than pm.max_children starves the workers and every
    # request ends in "upstream timed out while reading response header".
    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 8001 default_server backlog=8192 reuseport;
        server_name _;
        root /app/demo-php/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass   php-fpm;
            fastcgi_buffering off;
        }
    }
}
