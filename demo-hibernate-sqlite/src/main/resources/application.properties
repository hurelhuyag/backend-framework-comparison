logging.level.root=WARN
logging.level.io.github.hurelhuyag=DEBUG

spring.application.name=demo-hibernate-sqlite
spring.main.banner-mode=off

spring.threads.virtual.enabled=true

# Tomcat defaults to max-connections=8192, which is the only hard concurrency cap among the
# demos (Kestrel, Go, Axum and Node are effectively unbounded). At c=10000 that left ~1808
# connections queued until the client timed out. Raised so the row measures the server.
server.tomcat.max-connections=20000
server.tomcat.accept-count=4096

spring.datasource.url = jdbc:sqlite:demo.sqlite
spring.datasource.driverClassName = org.sqlite.JDBC

#spring.datasource.hikari.maximumPoolSize=20
#spring.datasource.hikari.cachePrepStmts=true
#spring.datasource.hikari.prepStmtCacheSize=250
#spring.datasource.hikari.prepStmtCacheSqlLimit=2048

# Paging defaults, matching the other demos. Out-of-range sizes are clamped by Spring Data.
spring.data.web.pageable.default-page-size = 20
spring.data.web.pageable.max-page-size = 100

spring.jpa.openInView = false
spring.jpa.showSql = false
spring.jpa.hibernate.ddlAuto = none
spring.jpa.hibernate.naming.physicalStrategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicitStrategy = org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.properties.hibernate.dialect = org.hibernate.community.dialect.SQLiteDialect

spring.sql.init.data-locations = classpath:/init.sql

spring.native.remove-yaml-support=false
spring.native.remove-jmx-support=false